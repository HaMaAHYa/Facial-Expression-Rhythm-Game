<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face Rhythm Challenge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h2>🎵 Face Rhythm Challenge</h2>
  <div id="hud">
    <div>Level<b id="lvl">1</b></div>
    <div>Round<b id="rnd">1/2</b></div>
    <div>Score<b id="score">0</b></div>
    <div>BPM<b id="bpm">60</b></div>
    <div>Detected<b id="det">-</b></div>
  </div>
  <div id="track"></div>
  <div id="stage">
    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>
    <div id="target"></div>
    <div id="tname"></div>
    <div id="msg"></div>
  </div>
  <button id="btn" disabled>Loading MediaPipe…</button>
  <button id="recal" class="alt" disabled>Recalibrate neutral</button>
  <button id="mute" class="alt">🔊</button>
  <div id="status">only use for KMUTNB 2026 Open House</div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
